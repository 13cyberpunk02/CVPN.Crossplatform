name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Логика общая для всех платформ - и проверяется на обеих
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Тесты
        run: dotnet test CVPN.Tests/CVPN.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Сборка десктопа
        run: dotnet build CVPN.Desktop/CVPN.Desktop.csproj --configuration Release

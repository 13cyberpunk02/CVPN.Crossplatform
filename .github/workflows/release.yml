name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса v'
        required: true
        default: '1.0.0'

env:
  SINGBOX_VERSION: '1.14.3'
  BYEDPI_VERSION: '0.17.3'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Установка Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Установщик и портативная сборка
        shell: pwsh
        run: >
          packaging/windows/build.ps1
          -Version ${{ needs.version.outputs.value }}
          -SingBoxVersion $env:SINGBOX_VERSION
          -ByeDpiVersion $env:BYEDPI_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-22.04   # старее glibc - пакет запустится на большем числе дистрибутивов
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: tar.gz, .deb, AppImage
        run: bash packaging/linux/build.sh ${{ needs.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Рабочая нагрузка Android
        run: dotnet workload install android

      - name: Урезанное ядро sing-box (arm64)
        run: bash packaging/android/build-core.sh

      - name: tun2socks и ByeDPI
        shell: pwsh
        run: packaging/android/fetch-natives.ps1 -SingBoxVersion $env:SINGBOX_VERSION -ByeDpiVersion $env:BYEDPI_VERSION

      # Ключ подписи - из секретов: обновления ставятся поверх только с тем же ключом.
      # Без секретов APK подписывается отладочным ключом - годится лишь для проверки.
      - name: Ключ подписи
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/cvpn.keystore"
            echo "args=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/cvpn.keystore -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_STORE_PASSWORD" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Релиз с отладочным ключом нельзя будет обновить релизным - лучше упасть
            echo "::error::ANDROID_KEYSTORE_BASE64 не задан - релиз без ключа подписи не публикуется"
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан - APK подписан отладочным ключом"
          fi

      - name: APK
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          dotnet publish CVPN.Android/CVPN.Android.csproj -c Release \
            -p:ApplicationDisplayVersion=${{ needs.version.outputs.value }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            ${{ steps.sign.outputs.args }} -o android-out
          mkdir -p dist
          cp android-out/*-Signed.apk "dist/CVPN-${{ needs.version.outputs.value }}-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  publish:
    needs: [ windows, linux, android ]
    # Ручной запуск - пробная сборка: артефакты в Actions, без релиза
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Текст релиза - packaging/release-notes.md в репозитории
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/release-notes.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: packaging/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

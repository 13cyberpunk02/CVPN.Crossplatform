name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса v'
        required: true
        default: '1.0.0'

env:
  SINGBOX_VERSION: '1.14.3'
  BYEDPI_VERSION: '0.17.3'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Установка Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Установщик и портативная сборка
        shell: pwsh
        run: >
          packaging/windows/build.ps1
          -Version ${{ needs.version.outputs.value }}
          -SingBoxVersion $env:SINGBOX_VERSION
          -ByeDpiVersion $env:BYEDPI_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-22.04   # старее glibc - пакет запустится на большем числе дистрибутивов
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: tar.gz, .deb, AppImage
        run: bash packaging/linux/build.sh ${{ needs.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
